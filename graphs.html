<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FK Lab：物理コアのグラフ</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 16px; background: #0b1220; color: #e6edf7;
        font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.note { margin: 0 0 16px; color: #9fb0c8; font-size: 13px; line-height: 1.6; }
      #plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
      figure { margin: 0; background: #111a2c; border: 1px solid #22304a; border-radius: 10px; padding: 12px; }
      figcaption { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
      figure small { display: block; margin-top: 6px; color: #9fb0c8; font-size: 12px; line-height: 1.5; }
      canvas { width: 100%; height: 280px; display: block; }
      ul.legend { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
      ul.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <h1>FK Lab：物理コアのグラフ</h1>
    <p class="note">
      空力係数（抗力・揚力・ナックル横力・回転の減衰）はすべて<strong>仮定値</strong>で、実測で検証したものではありません。
      <a href="./" style="color:#7cc4ff">3D のラボへ戻る</a>
    </p>
    <ul class="legend" id="legend"></ul>
    <div id="plots"></div>
    <script type="module" src="/src/dev/physicsGraph.ts"></script>
  </body>
</html>
